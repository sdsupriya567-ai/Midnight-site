<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayantika's World ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0614;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  header {
    text-align: center;
    margin-top: 20px;
  }
  .profile-img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 3px solid #ff69b4;
    box-shadow: 0 0 25px #ff69b4;
    object-fit: cover;
  }

  h1 {
    font-size: 26px;
    margin-top: 15px;
    color: #ffffff;
    text-shadow: 0 0 10px #ff69b4;
  }
  p.subtitle {
    color: #ffb6c1;
    font-size: 14px;
    margin-top: 5px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    margin-top: 30px;
  }
  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 182, 193, 0.3);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
  }
  .card h2 {
    color: #ff69b4;
    font-size: 18px;
    margin-bottom: 10px;
  }
  .card p {
    font-size: 14px;
    color: #ddd;
    line-height: 1.6;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 12px;
    text-align: center;
    background: linear-gradient(45deg, #ff69b4, #ff1493);
    color: white;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
    margin-top: 10px;
  }
</style>
</head>
<body>

  <header>
    <img src="1000169231.jpg" alt="Sayantika Profile" class="profile-img">
    <h1>SAYANTIKA CODES ✨</h1>
    <p class="subtitle">Creative Coder & Artist 🎨</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>🌸 About Me</h2>
      <p>কোডিং, স্কেচিং আর আর্ট নিয়ে নতুন নতুন জিনিস তৈরি করতে আমি খুব ভালোবাসি!</p>
    </div>

    <div class="card">
      <h2>🚀 My Projects</h2>
      <p>• 3D Cyber Bot Controller<br>• Cursed & Pretty Alert System<br>• Midnight World Website</p>
    </div>

    <button class="btn" onclick="sayHello()">Say Hi! 👋</button>
  </div>

<script>
  function sayHello() {
    alert("Welcome to Sayantika's World! Thanks for visiting. ✨💖");
  }
</script>
</body>
</html>
